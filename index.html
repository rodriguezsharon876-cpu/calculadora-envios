<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de costo de envío según el subtotal de una compra.">
    <title>Calculadora de envíos</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Tienda de demostración</p>
      <h1>Calculadora de envíos</h1>
      <p>El envío cuesta 8.000 COP y es gratis desde 100.000 COP.</p>

      <form id="formulario" novalidate>
        <label for="subtotal">Subtotal de la compra en COP</label>
        <input id="subtotal" name="subtotal" type="number" min="0" step="1" inputmode="numeric" placeholder="Ejemplo: 100000" required>
        <button type="submit">Calcular</button>
      </form>

      <p id="resultado" class="resultado" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
